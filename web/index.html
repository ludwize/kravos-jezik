<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">

<title>Kravos Jezik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%23131F24'/%3E%3Cpath fill='%231CB0F6' d='M52,40 L76,40 A8,8 0 0,1 84,48 L84,64 A8,8 0 0,1 76,72 L74,72 L74,80 L66,72 L60,72 A8,8 0 0,1 52,64 Z'/%3E%3Cpath fill='%2358CC02' d='M32,26 L64,26 A9,9 0 0,1 73,35 L73,56 A9,9 0 0,1 64,65 L44,65 L34,75 L34,65 L32,65 A9,9 0 0,1 23,56 L23,35 A9,9 0 0,1 32,26 Z'/%3E%3Cpath fill='%23fff' d='M36,33 L42,33 L42,43 L50,33 L58,33 L48,45.5 L58,58 L50,58 L42,48 L42,58 L36,58 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --green: #58CC02; --green-d: #46A302; --blue: #1CB0F6; --blue-d: #1899D6; --orange: #FF9600; --red: #FF4B4B; --red-d: #EA2B2B;
  --gold: #FFC800; --purple: #CE82FF; --purple-d: #A568CC;
  --bg: #FFFFFF; --ink: #3C3C3C; --dim: #777777; --border: #E5E5E5; --surface: #F7F7F7; --sheet: #FFFFFF;
  --ok-bg: #D7FFB8; --bad-bg: #FFDFE0; --sel-bg: #DDF4FF; --locked: #E5E5E5; --shadow: 0 20px 60px rgba(0,0,0,.18);
  --font: Nunito, "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131F24; --ink: #F1F7FB; --dim: #8A9BA5; --border: #37464F; --surface: #1A2830; --sheet: #1A2830;
    --ok-bg: #1C2E12; --bad-bg: #3A1A1C; --sel-bg: #1B3A4B; --locked: #37464F; --shadow: 0 20px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg: #131F24; --ink: #F1F7FB; --dim: #8A9BA5; --border: #37464F; --surface: #1A2830; --sheet: #1A2830;
  --ok-bg: #1C2E12; --bad-bg: #3A1A1C; --sel-bg: #1B3A4B; --locked: #37464F; --shadow: 0 20px 60px rgba(0,0,0,.55);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; font-weight: 600; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.dim { color: var(--dim); }
h1, h2, h3 { margin: 0; font-weight: 900; letter-spacing: -.01em; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; border-right: 2px solid var(--border); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 12px 22px; font-size: 21px; white-space: nowrap; font-weight: 900; color: var(--green); letter-spacing: -.02em; }
.logo svg { width: 34px; height: 34px; }
.rail a { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; border: 2px solid transparent; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); }
.rail a:hover { background: var(--surface); }
.rail a.on { color: var(--blue); background: var(--sel-bg); border-color: var(--blue); }
.rail a svg, .bnav a svg { width: 28px; height: 28px; flex: none; }
.main { min-width: 0; padding: 0 24px 60px; }
.col { max-width: 620px; margin: 0 auto; }
.aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }
.topbar { display: none; }
.bnav { display: none; }
@media (max-width: 1100px) { .shell { grid-template-columns: 96px minmax(0, 1fr) 300px; } .rail .lbl, .logo span { display: none; } .rail a { justify-content: center; } }
@media (max-width: 860px) {
  .shell { display: block; }
  .rail, .aside { display: none; }
  .main { padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
  .topbar { display: flex; position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 2px solid var(--border); padding: 8px 10px; align-items: center; gap: 6px; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 2px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 800; color: var(--dim); padding: 4px 0; border-radius: 12px; }
  .bnav a.on { color: var(--blue); }
  .bnav a.on svg { background: var(--sel-bg); border-radius: 12px; }
}
.stats { display: flex; align-items: center; gap: 14px; font-weight: 900; font-size: 17px; white-space: nowrap; }
.stats .st { display: flex; align-items: center; gap: 4px; }
.langbtn { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; font-weight: 800; }
.langbtn:hover { background: var(--surface); }
.langbtn .flag { font-size: 26px; line-height: 1; }
.langbtn .car { color: var(--dim); font-size: 13px; }

/* ---------- chunky controls ---------- */
.btn { --c: var(--green); --d: var(--green-d); display: block; width: 100%; padding: 14px 18px; border-radius: 16px; background: var(--c); color: #fff;
  font-weight: 900; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 4px 0 var(--d); transition: transform .05s, box-shadow .05s; text-align: center; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--d); }
.btn:disabled { background: var(--locked); color: var(--dim); box-shadow: 0 4px 0 var(--locked); cursor: default; }
.btn.blue { --c: var(--blue); --d: var(--blue-d); } .btn.red { --c: var(--red); --d: var(--red-d); } .btn.purple { --c: var(--purple); --d: var(--purple-d); }
.btn.ghost { background: var(--bg); color: var(--blue); border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); }
.btn.inline { display: inline-block; width: auto; }
.opt { display: block; width: 100%; text-align: center; padding: 13px 14px; border-radius: 16px; border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border);
  background: var(--bg); font-weight: 700; font-size: 17px; transition: transform .05s, box-shadow .05s; position: relative; }
.opt:hover:not(:disabled) { background: var(--surface); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--border); }
.opt .kbd { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--dim); border: 2px solid var(--border); border-radius: 8px; width: 24px; height: 24px; display: grid; place-items: center; }
.opt.sel { background: var(--sel-bg); border-color: var(--blue); box-shadow: 0 3px 0 var(--blue); color: var(--blue); }
.opt.right { background: var(--ok-bg); border-color: var(--green); box-shadow: 0 3px 0 var(--green); color: var(--green); }
.opt.wrong { background: var(--bad-bg); border-color: var(--red); box-shadow: 0 3px 0 var(--red); color: var(--red); }
.opt.done { color: var(--border); box-shadow: 0 3px 0 var(--border); cursor: default; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.spk { width: 56px; height: 56px; flex: none; border-radius: 14px; background: var(--blue); box-shadow: 0 4px 0 var(--blue-d); display: grid; place-items: center; color: #fff; }
.spk:active { transform: translateY(4px); box-shadow: none; }
.spk svg { width: 55%; height: 55%; }
.spk.big { width: 100px; height: 100px; border-radius: 22px; } .spk.sm { width: 42px; height: 42px; border-radius: 12px; } .spk.xs { width: 34px; height: 34px; border-radius: 10px; }
.spk.turtle { width: 64px; height: 64px; font-size: 30px; }
.tile { padding: 9px 13px; border-radius: 12px; border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); background: var(--bg); font-size: 18px; font-weight: 700; }
.tile:active { transform: translateY(3px); box-shadow: none; }
.tile.used { background: var(--border); color: transparent; box-shadow: none; pointer-events: none; }
.bubble { display: inline-block; padding: 10px 14px; border: 2px solid var(--border); border-radius: 14px; font-size: 22px; font-weight: 700; }
.pill { height: 16px; border-radius: 99px; background: var(--border); overflow: hidden; flex: 1; }
.pill > i { display: block; height: 100%; border-radius: 99px; background: var(--green); position: relative; transition: width .3s; }
.pill > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.28); }
.card { border: 2px solid var(--border); border-radius: 16px; padding: 16px; }
.card h3 { font-size: 18px; margin-bottom: 10px; }
.tip { display: flex; gap: 10px; padding: 14px; border-radius: 14px; background: var(--sel-bg); font-size: 15px; font-weight: 600; }

/* ---------- path ---------- */
.unit { margin: 22px 0 8px; border-radius: 16px; padding: 16px 18px; color: #fff; display: flex; align-items: center; gap: 12px; }
.unit .k { font-size: 12px; font-weight: 900; letter-spacing: .1em; opacity: .85; }
.unit h2 { font-size: 22px; }
.unit p { margin: 2px 0 0; font-size: 14px; opacity: .92; }
.unit .guideb { margin-left: auto; flex: none; display: flex; gap: 6px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 2px solid rgba(255,255,255,.4); box-shadow: 0 3px 0 rgba(0,0,0,.2); font-weight: 900; font-size: 13px; letter-spacing: .06em; color: #fff; }
.unit .guideb svg { width: 18px; height: 18px; }
.nodes { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 12px 0; }
.nodew { display: flex; flex-direction: column; align-items: center; }
.node { width: 74px; height: 70px; border-radius: 50%; background: var(--c); box-shadow: 0 7px 0 var(--d); display: grid; place-items: center; color: #fff; transition: transform .05s, box-shadow .05s; }
.node:active { transform: translateY(7px); box-shadow: none; }
.node svg { width: 34px; height: 34px; }
.node.cur { outline: 6px solid color-mix(in srgb, var(--c) 35%, transparent); outline-offset: 5px; }
.node.locked { --c: var(--locked); --d: color-mix(in srgb, var(--locked) 75%, #000); color: var(--dim); }
.nodew .t { font-size: 12px; font-weight: 800; margin-top: 10px; max-width: 130px; text-align: center; }
.nodew.locked .t { color: var(--dim); }
.start { margin-bottom: 10px; border: 2px solid var(--border); border-radius: 12px; padding: 7px 14px; font-weight: 900; letter-spacing: .08em; background: var(--bg); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .start { animation: none; } }

/* ---------- modals ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--sheet); border-radius: 20px; width: min(460px, 100%); max-height: 88vh; overflow-y: auto; padding: 22px; box-shadow: var(--shadow); }
@media (max-width: 860px) { .scrim { align-items: flex-end; padding: 0; } .modal { width: 100%; border-radius: 22px 22px 0 0; padding-bottom: calc(24px + env(safe-area-inset-bottom)); } }
.modal h2 { font-size: 24px; }
.kick { font-size: 13px; font-weight: 900; letter-spacing: .1em; }
.langrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; border-radius: 16px; border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); }
.langrow:hover { background: var(--surface); }
.langrow.sel { border-color: var(--blue); box-shadow: 0 3px 0 var(--blue); background: var(--sel-bg); }
.langrow .flag { font-size: 36px; }
.langrow b { font-size: 18px; font-weight: 900; display: block; }
.langrow.sel b { color: var(--blue); }
.langrow small { color: var(--dim); font-size: 13px; }

/* ---------- session ---------- */
.sess { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.sess .top { width: 100%; max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding: 18px 20px 6px; }
.x { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--dim); }
.x:hover { background: var(--surface); }
.x svg { width: 26px; height: 26px; }
.sess .body { flex: 1; overflow-y: auto; }
.sess .inner { max-width: 620px; margin: 0 auto; padding: 18px 20px 30px; }
.sess h1 { font-size: 27px; margin-bottom: 20px; }
.foot { border-top: 2px solid var(--border); }
.foot .in { max-width: 1000px; margin: 0 auto; padding: 18px 20px calc(18px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 16px; }
.foot .in .btn { width: auto; min-width: 170px; margin-left: auto; }
.foot.ok { background: var(--ok-bg); border-top-color: transparent; } .foot.bad { background: var(--bad-bg); border-top-color: transparent; }
.verdict { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
.verdict .ic { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 34px; font-weight: 900; }
.verdict h3 { font-size: 22px; }
.verdict .ans { font-size: 17px; font-weight: 700; } .verdict .mean { font-size: 14px; opacity: .85; }
.foot.ok .verdict { color: var(--green); } .foot.bad .verdict { color: var(--red); }
.foot.ok .ic { color: var(--green); } .foot.bad .ic { color: var(--red); }
.skip { color: var(--dim); font-weight: 900; letter-spacing: .06em; font-size: 13px; text-transform: uppercase; padding: 10px 6px; }
.skip:hover { color: var(--ink); }
@media (max-width: 640px) {
  .foot .in { flex-direction: column; align-items: stretch; gap: 10px; }
  .foot .in .btn { width: 100%; margin: 0; }
  .verdict .ic { width: 34px; height: 34px; font-size: 18px; }
  .sess h1 { font-size: 22px; }
}
.listen { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 10px 0 6px; }
.lines { position: relative; min-height: 120px; margin: 18px 0 26px; background: repeating-linear-gradient(transparent 0 56px, var(--border) 56px 58px); }
.lines .chosen { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
.bank { display: flex; flex-wrap: wrap; gap: 10px 8px; justify-content: center; }
textarea.type { width: 100%; min-height: 130px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); color: var(--ink); padding: 14px; font: inherit; font-size: 19px; font-weight: 700; resize: vertical; outline: none; }
textarea.type:focus { border-color: var(--blue); }
.chars { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.newword { text-align: center; padding-top: 18px; }
.newword .w { font-size: 40px; font-weight: 900; margin-top: 18px; }
.newword .m { font-size: 22px; color: var(--dim); }
.mic { width: 100%; padding: 22px; border-radius: 16px; border: 2px solid var(--border); box-shadow: 0 4px 0 var(--border); display: flex; gap: 10px; justify-content: center; align-items: center; color: var(--blue); font-weight: 900; letter-spacing: .08em; }
.mic.on { background: var(--red); border-color: var(--red); box-shadow: 0 4px 0 var(--red-d); color: #fff; }
.mic svg { width: 28px; height: 28px; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.pairs .c { display: grid; gap: 10px; }

/* ---------- done ---------- */
.done { text-align: center; max-width: 520px; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100%; justify-content: center; gap: 8px; }
.done .big { font-size: 90px; line-height: 1; }
.done h1 { font-size: 32px; }
.statboxes { display: flex; gap: 12px; width: 100%; margin: 22px 0 10px; }
.sbox { flex: 1; border-radius: 16px; background: var(--c); padding: 2px; }
.sbox small { display: block; color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .1em; padding: 4px 0; }
.sbox b { display: block; background: var(--bg); border-radius: 14px; padding: 14px 0; color: var(--c); font-size: 22px; font-weight: 900; }

/* ---------- story ---------- */
.line { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; animation: pop .25s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 18px; flex: none; }
.say { flex: 1; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--surface); }
.say .who { font-size: 13px; font-weight: 900; }
.say .sl { font-size: 19px; font-weight: 700; }
.say .sr { font-size: 15px; color: var(--dim); margin-top: 6px; }
.q { margin: 18px 0; }
.q h3 { font-size: 18px; margin-bottom: 10px; }

/* ---------- lists ---------- */
.ptitle { font-size: 28px; padding: 24px 0 12px; }
.search { width: 100%; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--border); background: var(--surface); outline: none; font-weight: 700; }
.search:focus { border-color: var(--blue); }
.wrow { display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-bottom: 2px solid var(--border); cursor: pointer; }
.wrow:hover { background: var(--surface); }
.wrow .w { font-weight: 900; font-size: 17px; }
.wrow .note { color: var(--blue); font-size: 13px; }
.bars { display: flex; gap: 3px; align-items: flex-end; }
.bars i { width: 5px; border-radius: 2px; background: var(--border); }
.bars i.on { background: var(--green); }
.chips { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
.chips .opt { width: auto; padding: 8px 14px; font-size: 14px; }
.toolrow { display: flex; align-items: center; gap: 14px; padding: 14px; border: 2px solid var(--border); border-radius: 16px; margin: 8px 0; width: 100%; text-align: left; }
.toolrow:hover { background: var(--surface); }
.toolrow .ic { font-size: 28px; }
.toolrow small { display: block; color: var(--dim); font-weight: 600; font-size: 13px; }
.hero { border-radius: 18px; padding: 20px; color: #fff; margin: 6px 0 14px; }
.hero h2 { font-size: 22px; }
.hero p { margin: 4px 0 14px; opacity: .92; font-size: 14px; }
.hero .btn { background: #fff; color: var(--c); box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.stat { display: flex; gap: 10px; align-items: center; border: 2px solid var(--border); border-radius: 16px; padding: 14px; }
.stat .ic { font-size: 26px; } .stat b { font-size: 21px; font-weight: 900; display: block; line-height: 1.1; } .stat small { color: var(--dim); font-size: 13px; }
.week { display: flex; justify-content: space-between; align-items: flex-end; height: 130px; }
.week .d { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); }
.week .d i { width: 24px; border-radius: 7px; background: var(--border); display: block; }
.week .d.today { color: var(--ink); font-weight: 900; }
.toggle { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
.toggle .t { flex: 1; } .toggle small { display: block; color: var(--dim); font-weight: 600; font-size: 13px; }
.sw { width: 52px; height: 30px; border-radius: 99px; background: var(--border); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw.on { background: var(--green); } .sw.on::after { transform: translateX(22px); }
.guidehead { border-radius: 0 0 18px 18px; padding: 22px; color: #fff; margin: 0 -16px 10px; }
@media (min-width: 861px) { .guidehead { margin: 20px 0 10px; border-radius: 18px; } }
.guidehead h1 { font-size: 30px; }
.gp { font-size: 17px; line-height: 1.6; margin: 12px 0; font-weight: 600; }
.ex { display: flex; gap: 10px; padding: 7px 0; cursor: pointer; }
.ex b { display: block; } .ex small { color: var(--dim); }
.wod .w { font-size: 26px; font-weight: 900; }
.foot-note { color: var(--dim); font-size: 13px; text-align: center; padding: 18px 0; font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="modal"></div>
<script>
'use strict';
/* =========================================================================
   Kravos Jezik — web edition. Same courses and recordings as the Android app.
   Progress lives in this browser (localStorage). Published by .github/workflows/web.yml.
   ========================================================================= */
const TEST = new URLSearchParams(location.search).has('test');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const CYR = { 'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'ђ': 'đ', 'е': 'e', 'ж': 'ž', 'з': 'z', 'и': 'i', 'ј': 'j', 'к': 'k', 'л': 'l', 'љ': 'lj', 'м': 'm', 'н': 'n', 'њ': 'nj', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'ћ': 'ć', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 'ч': 'č', 'џ': 'dž', 'ш': 'š' };

  norm(s) { return T.latin(s).toLowerCase().replace(/[.,!?¿¡;:"'„“”‚‘’«»()…\-–—]/g, ' ').replace(/\s+/g, ' ').trim(); },

    return p[b.length];

function prepCourse(o) {

      l.sentences = (l.sentences || []).map(s => ({ ...s, text: s.sl[0], meaning: s.sr[0], lessonId: l.id }));
      l.grammar = l.grammar || []; l.lines = l.lines || []; l.tip = l.tip || '';

class Progress {
  constructor(c) {
    this.c = c; this.key = 'kj.p.' + c.lang;

    this.done = d.done || {}; this.xp = d.xp || {}; this.srs = d.srs || {}; this.goal = d.goal || 20; this.unlockAll = !!d.unlockAll;
  }
  save() { store.set(this.key, { done: this.done, xp: this.xp, srs: this.srs, goal: this.goal, unlockAll: this.unlockAll }); }
  times(id) { return this.done[id] || 0; }

  unlocked(l) { if (this.unlockAll || l.order === 0) return true; const p = this.c.lessons[l.order - 1]; return !p || this.isDone(p.id) || this.isDone(l.id); }

  streak() { let d = today(); if (!this.xpOn(d)) d--; let n = 0; while (this.xpOn(d) > 0) { n++; d--; } return n; }

    this.save();

    else this.srs[k] = [1, t, c[2] + 1, c[3] + 1];

  weakest() { return Object.entries(this.srs).sort((a, b) => a[1][0] - b[1][0] || b[1][3] - a[1][3]).map(([k]) => this.c.wordByKey[k]).filter(Boolean); }

const Snd = {

    const pre = S.course.tts.slice(0, 2).toLowerCase();

/* ------------------------------------------------------------- session builder */
function distract(w, pool, sl, n = 3) {
  const wsr = new Set(w.sr.map(x => x.toLowerCase()));
  const ok = pool.filter(p => p.key !== w.key && !p.sr.some(x => wsr.has(x.toLowerCase())));
  const own = sl ? new Set([w.sl.toLowerCase()]) : wsr;
  const val = p => sl ? p.sl : p.sr[0];
  const same = shuffle(ok.filter(p => p.unitIdx === w.unitIdx).map(val)).filter(x => !own.has(x.toLowerCase()));
  const all = shuffle(ok.map(val)).filter(x => !own.has(x.toLowerCase()));
  return uniq([...same, ...all]).slice(0, n);
}

}
const B = {
  pickSlSr: (w, pool) => ({ kind: 'pick', title: 'Šta znači ova reč?', prompt: w.sl, options: shuffle([...distract(w, pool, false), w.sr[0]]), answer: w.sr[0], promptIsSl: true, word: w, sl: w.sl }),
  pickSrSl: (w, pool) => ({ kind: 'pick', title: `Kako se kaže na ${S.course.loc}?`, prompt: w.meaning, options: shuffle([...distract(w, pool, true), w.sl]), answer: w.sl, promptIsSl: false, word: w, sl: w.sl }),
  listenPick: (w, pool) => ({ kind: 'pick', title: 'Šta čuješ?', prompt: w.sl, options: shuffle([...distract(w, pool, true), w.sl]), answer: w.sl, promptIsSl: true, listen: true, word: w, sl: w.sl }),
  match: ws => ({ kind: 'match', pairs: ws.map(w => [w.sl, w.sr[0]]), words: ws }),
  arrangeSl: (s, others) => { const t = T.tokens(s.text); return { kind: 'arrange', title: `Prevedi na ${S.course.acc}`, prompt: s.meaning, tiles: shuffle([...t, ...extraTiles(t, others.map(o => o.text), 3)]), accepted: s.sl, sl: s.text, meaning: s.meaning }; },
  arrangeSr: (s, others) => { const t = T.tokens(s.meaning); return { kind: 'arrange', title: 'Prevedi na srpski', prompt: s.text, promptIsSl: true, tiles: shuffle([...t, ...extraTiles(t, others.map(o => o.meaning), 3)]), accepted: s.sr, sl: s.text, meaning: s.meaning }; },
  listenArrange: (s, others) => { const t = T.tokens(s.text); return { kind: 'arrange', title: 'Složi ono što čuješ', prompt: s.text, promptIsSl: true, listen: true, tiles: shuffle([...t, ...extraTiles(t, others.map(o => o.text), 2)]), accepted: s.sl, sl: s.text, meaning: s.meaning }; },
  typeSl: s => ({ kind: 'type', title: `Napiši na ${S.course.loc}`, prompt: s.meaning, accepted: s.sl, sl: s.text, meaning: s.meaning }),
  typeWord: w => ({ kind: 'type', title: `Napiši na ${S.course.loc}`, prompt: w.meaning, accepted: [w.sl], word: w, sl: w.sl, meaning: w.meaning }),
  dictation: w => ({ kind: 'type', title: 'Napiši šta čuješ', prompt: w.sl, listen: true, accepted: [w.sl], word: w, sl: w.sl, meaning: w.meaning }),
  speak: s => ({ kind: 'speak', text: s.text, meaning: s.meaning, sl: s.text }),
  fill: g => ({ kind: 'fill', g, options: shuffle([...g.wrong.slice(0, 3), g.answer]), sl: g.full }),

function buildLesson(l) {
  const c = S.course, p = S.prog;
  const canListen = listenActive() && Snd.canPlay(), canSpeak = speakActive();
  const pool = c.wordsUpTo(l.order + 2);
  const first = !p.isDone(l.id);
  const ws = shuffle(l.words), ss = shuffle(l.sentences);
  const out = [];
  ws.slice(0, 7).forEach((w, i) => {
    if (first && !p.isLearned(w.key)) out.push({ kind: 'intro', word: w, sl: w.sl });
    out.push(i % 3 === 2 && canListen ? B.listenPick(w, pool) : i % 2 === 0 ? B.pickSlSr(w, pool) : B.pickSrSl(w, pool));
  });
  const matchable = ws.slice(0, 7).filter(w => w.sl.toLowerCase() !== w.sr[0].toLowerCase());
  if (matchable.length >= 4) out.push(B.match(matchable.slice(0, 5)));

  ss.slice(0, 5).forEach((s, i) => {

  });

function buildReview(max = 14) {
  const c = S.course, p = S.prog, canListen = listenActive() && Snd.canPlay();
  const words = uniq([...p.due(), ...p.weakest()], w => w.key).slice(0, max);
  if (!words.length) return [];
  const out = words.map((w, i) => {
    switch ((i + Math.floor(Math.random() * 4)) % 4) {
      case 0: return B.pickSlSr(w, c.words);
      case 1: return canListen ? B.listenPick(w, c.words) : B.pickSrSl(w, c.words);
      case 2: return B.typeWord(w);
      default: return B.pickSrSl(w, c.words);

  shuffle(c.sentences.filter(s => doneIds.has(s.lessonId))).slice(0, 3).forEach((s, i) => out.push(i === 1 && canListen ? B.listenArrange(s, c.sentences) : B.arrangeSl(s, c.sentences)));

const needsListening = e => !!e.listen;
const again = e => ({ ...e, options: e.options ? shuffle(e.options) : undefined, tiles: e.tiles ? shuffle(e.tiles) : undefined });

function startSession(lessonId) {

  S.sess = { lesson: l, queue, idx: 0, pending: null, verdict: null, results: {}, retries: {}, mistakes: 0, graded: 0, start: Date.now(), summary: null, ui: {} , quit: false };
  renderSession();

function autoplay() {

  else if (e.listen) Snd.play(e.prompt);
  else if (e.kind === 'pick' && e.promptIsSl) Snd.play(e.prompt);
  else if (e.kind === 'arrange' && e.promptIsSl) Snd.play(e.prompt);

function evaluate(e, pending) {

    case 'fill': return pending === e.g.answer ? { ok: true, title: pick(PRAISE), answer: e.g.full, meaning: e.g.sr } : { ok: false, title: 'Tačan odgovor:', answer: e.g.full, meaning: e.g.sr };
    case 'arrange': { const m = T.check(pending, e.accepted); return (m === 'EXACT' || m === 'ACCENT') ? { ok: true, title: pick(PRAISE), meaning: e.listen ? e.meaning : null } : { ok: false, title: 'Tačan odgovor:', answer: e.accepted[0], meaning: (e.listen || !e.promptIsSl) ? e.meaning : null }; }

      const m = T.check(pending, e.accepted);
      if (m === 'EXACT') return { ok: true, title: pick(PRAISE), meaning: e.listen ? e.meaning : null };
      if (m === 'ACCENT') return { ok: true, title: 'Tačno, ali pazi na znakove:', answer: e.accepted[0], meaning: e.meaning };
      if (m === 'TYPO') return { ok: true, title: 'Mala greška u kucanju:', answer: e.accepted[0], meaning: e.meaning };
      return { ok: false, title: 'Tačan odgovor:', answer: e.accepted[0], meaning: e.meaning };
    }
    case 'speak': {
      const heard = (pending || '').split('\n').filter(Boolean);
      const best = Math.max(0, ...heard.map(h => T.sim(h, e.text)));
      return best >= 0.72 ? { ok: true, title: 'Odlično izgovoreno!', meaning: e.meaning } : { ok: false, title: 'Nije baš jasno. Treba:', answer: e.text, meaning: heard[0] ? `Čuo sam: „${heard[0]}“` : null };
    }
    default: return { ok: true, title: pick(PRAISE) };
  }
}
function grade(e, v) {
  const s = S.sess;
  s.verdict = v;
  if (e.kind !== 'match') s.graded++;
  if (e.word) s.results[e.word.key] = (s.results[e.word.key] ?? true) && v.ok;
  if (e.kind === 'match') e.words.forEach(w => { if (!(w.key in s.results)) s.results[w.key] = true; });
  if (!v.ok) {
    s.mistakes++;
    const k = `${e.kind}|${e.sl}|${e.word ? e.word.key : ''}`;
    const n = s.retries[k] || 0;
    if (n < 2) { s.retries[k] = n + 1; s.queue.push(again(e)); }
  }
  if (e.kind !== 'speak' && e.kind !== 'intro' && e.sl) Snd.play(e.sl);
  stopMic();
  renderSession();
}
function check() {
  const s = S.sess; const e = s.queue[s.idx];
  if (s.verdict) return next();
  if (e.kind === 'intro') return next();
  if (!TEST && (s.pending == null || s.pending === '')) return;

}
function next() {
  const s = S.sess;

  s.idx++;

}
function finishSession() {
  const s = S.sess, p = S.prog;
  const acc = s.graded === 0 ? 100 : Math.floor(Math.max(0, s.graded - s.mistakes) * 100 / s.graded);
  const xp = s.lesson ? 10 + (!p.isDone(s.lesson.id) ? 5 : 0) + (s.mistakes === 0 ? 5 : 0) : 5 + Math.floor(Object.keys(s.results).length / 2);
  p.finish(s.lesson ? s.lesson.id : null, xp, s.results);
  s.summary = { xp, acc, sec: Math.round((Date.now() - s.start) / 1000), lesson: !!s.lesson };
  renderSession();
}
function snooze(listen) {
  const s = S.sess, until = Date.now() + 3600e3;
  if (listen) S.settings.listenSnooze = until; else S.settings.speakSnooze = until;
  saveSettings();
  const rest = s.queue.slice(s.idx + 1).filter(e => listen ? !needsListening(e) : e.kind !== 'speak');
  s.queue = [...s.queue.slice(0, s.idx + 1), ...rest];

}
function closeSession() { Snd.stop(); stopMic(); S.sess = null; document.getElementById('overlay').innerHTML = ''; document.body.style.overflow = ''; go(S.backTo || '#/'); }

let rec = null;
function stopMic() { if (rec) { try { rec.abort(); } catch (e) {} rec = null; } if (S.sess) S.sess.ui.listening = false; }
function startMic() {
  const s = S.sess; const e = s.queue[s.idx];

  Snd.stop();

/* ------------------------------------------------------------- router & render */
const NAV = [['#/', 'Učenje', I.home], ['#/ponavljanje', 'Ponavljanje', I.review], ['#/recnik', 'Rečnik', I.book], ['#/profil', 'Profil', I.user], ['#/podesavanja', 'Podešavanja', I.gear]];
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function render() {
  if (!S.course) return;
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/lekcija\/(.+)$/))) { S.backTo = '#/'; startSession(decodeURIComponent(m[1])); history.replaceState(null, '', '#/'); }
  else if (h === '#/review') { S.backTo = '#/ponavljanje'; startSession(null); history.replaceState(null, '', '#/ponavljanje'); }
  else if ((m = h.match(/^#\/prica\/(.+)$/))) { S.backTo = '#/'; startStory(decodeURIComponent(m[1])); history.replaceState(null, '', '#/'); }
  const page = location.hash || '#/';
  let body, act = '#/';
  if ((m = page.match(/^#\/vodic\/(\d+)$/))) body = pageGuide(+m[1]);
  else if (page === '#/ponavljanje') { body = pageReview(); act = page; }
  else if (page === '#/recnik') { body = pageWords(); act = page; }
  else if (page === '#/profil') { body = pageProfile(); act = page; }
  else if (page === '#/podesavanja') { body = pageSettings(); act = page; }
  else if (page === '#/lazni') { body = pageFalse(); act = '#/ponavljanje'; }
  else body = pagePath();
  document.getElementById('app').innerHTML = `<div class="shell">
    <nav class="rail"><div class="logo">${I.logo}<span>Kravos Jezik</span></div>${NAV.map(([href, l, ic]) => `<a href="${href}" class="${act === href ? 'on' : ''}">${ic}<span class="lbl">${l}</span></a>`).join('')}</nav>
    <main class="main"><div class="topbar">${langBtn()}<span style="flex:1"></span>${statsHTML()}</div>${body}</main>
    <aside class="aside">${aside()}</aside></div>
    <nav class="bnav">${NAV.slice(0, 4).map(([href, l, ic]) => `<a href="${href}" class="${act === href ? 'on' : ''}">${ic}<span>${l}</span></a>`).join('')}</nav>`;
  renderModal();
  if (!S.sess && !S.story) { document.getElementById('overlay').innerHTML = ''; document.body.style.overflow = ''; }
}
function renderModal() {
  const el = document.getElementById('modal');
  if (!S.modal) { el.innerHTML = ''; return; }
  let html = '';
  if (S.modal.type === 'lesson') html = lessonModal(S.modal.id);
  else if (S.modal.type === 'langs') html = langModal();
  else if (S.modal.type === 'quit') html = `<h2>Prekini lekciju?</h2><p class="dim">Napredak iz ove lekcije neće biti sačuvan.</p><div style="display:grid;gap:12px;margin-top:18px"><button class="btn" data-act="closemodal">Nastavi učenje</button><button class="btn ghost" style="color:var(--red)" data-act="quitnow">Prekini</button></div>`;
  else if (S.modal.type === 'reset') html = `<h2>Resetuj napredak za ${esc(S.course.name.toLowerCase())}?</h2><p class="dim">Brišu se završene lekcije, XP, niz dana i ponavljanje reči za ovaj jezik. Ovo ne može da se vrati.</p><div style="display:grid;gap:12px;margin-top:18px"><button class="btn" data-act="closemodal">Odustani</button><button class="btn red" data-act="resetnow">Resetuj</button></div>`;
  el.innerHTML = `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
}
function applyTheme() { const t = S.settings.theme; if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
async function setLang(l) {
  if (!S.courses[l]) await loadCourse(l);
  Snd.stop(); S.lang = l; S.settings.lang = l; saveSettings(); S.modal = null; go('#/'); render(); window.scrollTo(0, 0);
}
async function loadCourse(l) {
  const r = await fetch(`courses/${l}.json`, { cache: 'no-cache' });
  const c = prepCourse(await r.json());
  S.courses[l] = c; S.progress[l] = new Progress(c);
}

/* ------------------------------------------------------------- events */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, s = S.sess;
  switch (a) {
    case 'say': ev.preventDefault(); Snd.play(t.dataset.t, !!t.dataset.slow); break;
    case 'lesson': S.modal = { type: 'lesson', id: t.dataset.id }; renderModal(); break;
    case 'start': { const l = S.course.byId[t.dataset.id]; S.modal = null; renderModal(); go(l.type === 'story' ? `#/prica/${encodeURIComponent(l.id)}` : `#/lekcija/${encodeURIComponent(l.id)}`); break; }
    case 'langs': S.modal = { type: 'langs' }; renderModal(); break;
    case 'setlang': setLang(t.dataset.l); break;
    case 'scrim': if (ev.target === t) { S.modal = null; renderModal(); } break;
    case 'closemodal': S.modal = null; renderModal(); break;
    case 'review': go('#/review'); break;
    case 'quit': S.modal = { type: 'quit' }; renderModal(); break;
    case 'quitnow': S.modal = null; renderModal(); closeSession(); break;
    case 'closesess': S.story = null; closeSession(); break;
    case 'choose': if (s && !s.verdict) { s.pending = t.dataset.v; renderSession(); } break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'snooze': snooze(t.dataset.l === '1'); break;
    case 'tile': if (s && !s.verdict) { s.ui.chosen.push(+t.dataset.i); s.pending = s.ui.chosen.map(i => s.queue[s.idx].tiles[i]).join(' '); renderSession(); } break;
    case 'untile': if (s && !s.verdict) { s.ui.chosen = s.ui.chosen.filter(i => i !== +t.dataset.i); s.pending = s.ui.chosen.map(i => s.queue[s.idx].tiles[i]).join(' ') || null; renderSession(); } break;
    case 'char': { const ta = document.getElementById('typed'); if (ta && s && !s.verdict) { const a0 = ta.selectionStart, b0 = ta.selectionEnd; ta.value = ta.value.slice(0, a0) + t.dataset.v + ta.value.slice(b0); s.pending = ta.value; ta.focus(); ta.setSelectionRange(a0 + t.dataset.v.length, a0 + t.dataset.v.length); const btn = document.getElementById('main-btn'); if (btn) btn.disabled = !ta.value.trim() && !TEST; } break; }
    case 'mic': if (s.ui.listening) stopMic(), renderSession(); else startMic(); break;
    case 'pair': {
      const e = s.queue[s.idx], u = s.ui, v = t.dataset.v;
      if (t.dataset.side === 'l') { u.selL = v; Snd.play(v); } else u.selR = v;
      if (u.selL != null && u.selR != null) {
        if (e.pairs.some(x => x[0] === u.selL && x[1] === u.selR)) { u.solved.push(u.selL); u.bad = null; }
        else { u.bad = [u.selL, u.selR]; e.words.filter(w => w.sl === u.selL || w.sr[0] === u.selR).forEach(w => s.results[w.key] = false); setTimeout(() => { if (S.sess === s && u.bad) { u.bad = null; renderSession(); } }, 700); }
        u.selL = null; u.selR = null;
        if (u.solved.length === e.pairs.length) return grade(e, { ok: true, title: pick(PRAISE) });
      }
      renderSession(); break;
    }
    case 'line': { const st = S.story, i = +t.dataset.i; st.open[i] = !st.open[i]; Snd.play(st.l.lines[i].sl); renderStory(); break; }
    case 'sq': { const st = S.story, i = +t.dataset.i, x = st.l.lines[i]; st.answers[i] = t.dataset.v; if (t.dataset.v !== x.answer) st.mistakes++; renderStory(); break; }
    case 'storynext': { const st = S.story; if (storyBlocked(st)) break; st.shown++; renderStory(); const x = st.l.lines[st.shown - 1]; if (x && x.sl) Snd.play(x.sl); break; }
    case 'storyend': {
      const st = S.story, q = st.l.lines.filter(x => x.q).length;
      const xp = 15 + (st.mistakes === 0 ? 5 : 0);
      S.prog.finish(st.l.id, xp, {});
      st.done = { xp, acc: q ? Math.floor(Math.max(0, q - st.mistakes) * 100 / q) : 100 };
      renderStory(); break;
    }
    case 'wonly': S.wordsOnly = t.dataset.v === '1'; render(); break;
    case 'goal': S.prog.goal = +t.dataset.v; S.prog.save(); render(); break;
    case 'tog': {
      const k = t.dataset.k;
      if (k === 'unlock') { S.prog.unlockAll = !S.prog.unlockAll; S.prog.save(); }
      else { S.settings[k] = !S.settings[k]; saveSettings(); }
      render(); break;
    }
    case 'theme': S.settings.theme = t.dataset.v; saveSettings(); applyTheme(); render(); break;
    case 'reset': S.modal = { type: 'reset' }; renderModal(); break;
    case 'resetnow': S.prog.reset(); S.modal = null; render(); break;
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'typed' && S.sess) { S.sess.pending = ev.target.value; const b = document.getElementById('main-btn'); if (b) b.disabled = !ev.target.value.trim() && !TEST; }
  if (ev.target.id === 'wq') { S.wordsQ = ev.target.value; document.getElementById('wlist').innerHTML = wordList(S.wordsQ, !!S.wordsOnly); }
});
document.addEventListener('keydown', ev => {
  if (S.modal && ev.key === 'Escape') { S.modal = null; renderModal(); return; }
  const s = S.sess;
  if (s && !s.summary && s.queue.length) {
    const e = s.queue[s.idx];
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); if (s.verdict || e.kind === 'intro') next(); else check(); return; }
    if (!s.verdict && /^[1-9]$/.test(ev.key) && (e.kind === 'pick' || e.kind === 'fill') && document.activeElement?.id !== 'typed') {
      const o = e.options[+ev.key - 1]; if (o != null) { s.pending = o; renderSession(); }
    }
    if (ev.key === 'Escape') { S.modal = { type: 'quit' }; renderModal(); }
    return;
  }
  if (s && s.summary && ev.key === 'Enter') { closeSession(); return; }
  const st = S.story;
  if (st && ev.key === 'Enter') { ev.preventDefault(); document.getElementById('main-btn')?.click(); }
});
window.addEventListener('hashchange', () => { if (S.sess && !/^#\/(lekcija|prica|review)/.test(location.hash)) { /* navigating away ends the session */ } render(); });

/* ------------------------------------------------------------- boot */
(async function boot() {
  applyTheme();
  try {
    S.meta = await (await fetch('courses/index.json', { cache: 'no-cache' })).json();
    const want = S.meta.some(m => m.lang === S.settings.lang) ? S.settings.lang : S.meta[0].lang;
    await Promise.all(S.meta.map(m => loadCourse(m.lang)));
    S.lang = want;
    render();
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="col" style="padding:40px 16px"><h1>Ne mogu da učitam kurs</h1><p class="dim">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
